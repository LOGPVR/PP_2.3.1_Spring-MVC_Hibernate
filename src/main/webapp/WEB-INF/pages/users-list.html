<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        table { width: 60%; border-collapse: collapse; margin-top: 20px; font-family: sans-serif; }
        th, td { border: 1px solid #bbb; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { display: inline-block; margin-bottom: 15px; padding: 8px 16px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; font-family: sans-serif; }
    </style>
</head>
<body>

<h2>Cписок пользователей (JPA + Hibernate)</h2>

<a th:href="@{/new}" class="btn">Добавить пользователя</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <!-- Итерируемся по списку, полученному из контроллера -->
    <tr th:each="u : ${usersList}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">Имя</td>
        <td th:text="${u.lastName}">Фамилия</td>
        <td th:text="${u.email}">email@example.com</td>
        <td>
            <!-- Формируем ссылку на редактирование как /users/edit?id=... -->
            <<a th:href="@{/edit(id=${u.id})}">Редактировать</a>
            |
            <!-- Форма отправки POST-запроса на удаление /users/delete?id=... -->
            <form th:action="@{/delete(id=${u.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Вы уверены, что хотите удалить этого пользователя?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
