<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма пользователя</title>
    <style>
        font-family: sans-serif;
        .form-group { margin-bottom: 15px; font-family: sans-serif; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 350px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Динамический заголовок: если ID есть — это редактирование, если нет — добавление -->
<h2 th:text="${user.id != null} ? 'Редактировать пользователя' : 'Добавить нового пользователя'">Форма</h2>

<form th:action="@{/save}" th:object="${user}" method="post">

    <!-- Скрытое поле для ID (чтобы Spring сопоставил его при обновлении) -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="name">Имя:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>

    <div class="form-group">
        <label for="lastName">Фамилия:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required />
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />
    </div>

    <button type="submit">Сохранить</button>
    <a th:href="@{/}" style="margin-left: 15px; color: #6c757d; text-decoration: none;">Назад к списку</a>
</form>

</body>
</html>
